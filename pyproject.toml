[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dakkar"
version = "2026.11.8.50"
description = "Dakkar is a GNOME file browser with grid, list, tab and pane views."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "William Breaden Madden", email = "wbm@protonmail.ch"},
]
keywords = ["file-browser", "file-manager", "gnome", "gtk", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = ["docopt>=0.6.2"]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/wdbm/dakkar"
Repository = "https://github.com/wdbm/dakkar.git"
Issues = "https://github.com/wdbm/dakkar/issues"

[project.scripts]
dakkar = "dakkar.cli:main"

[tool.setuptools]
packages = ["dakkar", "dakkar.data"]
include-package-data = true

[tool.setuptools.package-data]
"dakkar.data" = ["*.desktop.in", "*.svg"]
